<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ધ લેગસી · Host</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#fbf3e4;--ink:#2b1a12;--mut:#6b4a38;--card:#fff;--line:#ead9bd;--mar:#7a1f1a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Vadodara',system-ui,sans-serif}
#app{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0}
.btn{border:0;border-radius:12px;background:var(--mar);color:#fff;font-family:inherit;font-size:16px;font-weight:700;min-height:46px;padding:8px 16px;cursor:pointer}
.btn.sec{background:#fff;color:var(--mar);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
input,textarea,select{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:16px;background:#fff;color:var(--ink)}
textarea{min-height:200px;font-size:14px}
label{font-size:13px;font-weight:600;color:var(--mut);display:block;margin-bottom:3px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.mut{color:var(--mut);font-size:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{padding:4px 12px;border-radius:999px;background:#fde8c5;font-size:13px;font-weight:600}
.zl{display:flex;flex-wrap:wrap;gap:6px}
.zl span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
@media(max-width:700px){.g2,.g4{grid-template-columns:1fr}}
/* projector */
#pj{position:fixed;inset:0;background:#2a1410;color:#fbf3e4;z-index:50;display:none;flex-direction:column;padding:2.2vw 3vw;gap:1.6vw;overflow:hidden}
#pj.on,body.pjmode #pj{display:flex}
body.pjmode #app{display:none}
.pj-top{display:flex;justify-content:space-between;align-items:flex-end}
.pj-t{font-size:3.2vw;font-weight:700;line-height:1.1}
.pj-s{font-size:1.2vw;letter-spacing:.14em;color:#f0b429;font-weight:600}
.pj-body{flex:1;display:flex;flex-direction:column;gap:1.6vw;min-height:0}
.pj-x{position:absolute;right:1vw;top:.6vw;background:none;border:0;color:#fbf3e4;font-size:2vw;cursor:pointer;opacity:.6}
.pjq{border-radius:1.6vw;padding:2vw 2.6vw;display:flex;flex-direction:column;gap:1.2vw}
.pjq .q{font-size:3.4vw;font-weight:700;line-height:1.25}
.pj-num{font-size:14vw;font-weight:700;line-height:1}
.pj-alert{position:absolute;left:50%;top:1.2vw;transform:translateX(-50%);background:#c8372d;color:#fff;font-size:2.6vw;font-weight:700;padding:.6vw 3vw;border-radius:1.2vw;z-index:3;box-shadow:0 .4vw 2vw rgba(0,0,0,.5)}
.mz{display:grid;gap:1.2vw;flex:1;min-height:0}
.mt{background:#3d211b;border-radius:1.4vw;padding:1.2vw;display:flex;flex-direction:column;justify-content:flex-end;gap:.7vw;position:relative;overflow:hidden;min-height:0}
.mt .st{display:flex;flex-direction:column;align-items:center;gap:.25vw;flex:1;justify-content:flex-end}
.mt .fog{position:absolute;left:0;right:0;top:0;height:60%;background:linear-gradient(#3d211b 10%,rgba(61,33,27,0));pointer-events:none}
.mt .nm{display:flex;justify-content:space-between;align-items:baseline;font-size:1.7vw;font-weight:700}
.mt .nm small{font-size:1.1vw;color:#d9b995;font-weight:500}
.win{background:#3d211b;border-radius:1.6vw;padding:2vw;text-align:center}
.win .tt{font-size:2.4vw;color:#f0b429;font-weight:700}.win .nn{font-size:6vw;font-weight:700;line-height:1.15}.win .ee{font-size:2vw;color:#d9b995}
.wl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8vw}
.wl div{background:#3d211b;border-radius:1vw;padding:.7vw 1vw;font-size:1.3vw}
.wl b{display:block;font-size:1.6vw}
</style>
</head>

  return '<h1 style="color:var(--mar)">નવી ગેમ બનાવો</h1><div class="box" style="display:flex;flex-direction:column;gap:12px"><div class="g2"><div><label>ગેમનું નામ</label><input id="gt" value="ધ લેગસી"></div><div><label>સબટાઇટલ</label><input id="gs" value="સત્સંગ યુનો બિંગો"></div></div><div class="g2"><div><label>Host નું નામ</label><input id="hn" value="Host"></div><div><label>મહત્તમ Players (ખાલી = અમર્યાદ)</label><input id="mp" type="number" min="1"></div></div><div><label>ફેઝનાં નામ (દરેક ફેઝ = એક રંગ)</label><div class="g4">'+pn.map(function(n,i){return '<input id="pn'+i+'" value="'+n+'">';}).join('')+'</div></div><div><label>સામાન્ય પ્રશ્નનો સમય (સેકન્ડ)</label><input id="qs" type="number" value="30" min="10" max="120"></div><div><label>પ્રશ્નો (દરેક લાઇનમાં  પ્રશ્ન::જવાબ)</label><textarea id="qa">'+esc(SAMPLE)+'</textarea><div class="mut" style="margin-top:4px">ફેઝ દીઠ 9 પ્રશ્ન, કુલ 36. ખાસ પ્રશ્નો: <b>[sant][img:ફાઇલ.jpg] પ્રશ્ન::જવાબ</b> (ફોટો ધીમે ધીમે સ્પષ્ટ થાય) · <b>[kram] પ્રશ્ન::પહેલો|બીજો|ત્રીજો|ચોથો</b> (સાચો ક્રમ લખો, Players ને ગૂંચવીને બતાવાશે). કાર્ડમાં સામાન્ય/સંત પ્રશ્નોના 25 જવાબ આવે છે.</div></div>'+(createErr?'<div style="color:#c8372d;font-weight:600">'+esc(createErr)+'</div>':'')+'<button class="btn" onclick="create()">ગેમ બનાવો</button></div>';
}
function zonesList(){
  var z={}; (S.players||[]).forEach(function(p){(z[p.zone]=z[p.zone]||[]).push(p);});
  return Object.keys(z).sort().map(function(k){return '<div class="box"><div class="top"><b>'+esc(k)+'</b><span class="chip">'+z[k].length+' Players</span></div><div class="zl" style="margin-top:6px">'+z[k].map(function(p){return '<span style="'+(p.online?'':'opacity:.5')+'">'+esc(p.avatar)+' '+esc(p.name)+'</span>';}).join('')+'</div></div>';}).join('')||'<div class="mut">હજી કોઈ જોડાયું નથી.</div>';
}
function dashView(){
  var st=S.status, h='<div class="top"><div><h1 style="color:var(--mar)">'+esc(S.gTitle)+' · Host</h1><div class="mut">'+esc(S.gSub)+'</div></div><div class="top"><button class="btn" onclick="pjOpen()">પ્રોજેક્ટર સ્ક્રીન</button><button class="btn sec" onclick="newRoom()">નવી ગેમ</button></div></div>';
  h+='<div class="box top"><div><div class="mut">Room કોડ</div><div style="font-size:40px;font-weight:700;letter-spacing:.1em">'+esc(S.code)+'</div><div class="mut">Players: '+esc(link())+'</div><div class="mut">બીજી સ્ક્રીન (પ્રોજેક્ટર): '+esc(location.origin+'/host.html?pj='+S.code)+'</div></div>'+qrImg(link(),150)+'</div>';
  // controls
  var lastDone=S.usedN>=S.total, ctl='';
  if(st==='lobby') ctl='<button class="btn" onclick="E(\'host:start\')">ગેમ શરૂ કરો ('+S.nPlayers+' Players)</button>';
  else if(st==='ready') ctl='<button class="btn" onclick="E(\'host:next\')">પહેલો પ્રશ્ન શરૂ કરો</button>';
  else if(st==='announce') ctl='<span class="chip">પ્રશ્ન '+S.usedN+' આવી રહ્યો છે…</span>';
  else if(st==='question') ctl='<button class="btn" onclick="E(\'host:skipTimer\')">સમય પૂરો કરો</button>';
  else if(st==='locked'||st==='phasebreak'){
    ctl=(lastDone?'':'<button class="btn" onclick="E(\'host:next\')">'+(st==='phasebreak'?'આગલો ફેઝ શરૂ કરો':'આગલો પ્રશ્ન')+'</button>')+'<button class="btn sec" onclick="if(confirm(\'રિઝલ્ટ રિવીલ કરવું છે?\'))E(\'host:reveal\')">રિઝલ્ટ રિવીલ</button>';
  } else if(st==='ended') ctl='<button class="btn" onclick="E(\'host:reveal\')">રિઝલ્ટ રિવીલ</button>';
  else if(st==='revealed'){ var w=S.allWinners||[], nx=w[S.revStep]; ctl=S.revStep<w.length?'<button class="btn" onclick="E(\'host:nextWinner\')">આગલો વિજેતા: '+esc(nx?nx.title:'')+'</button>':'<span class="chip">બધા વિજેતા જાહેર</span>'; }
  h+='<div class="box" style="display:flex;flex-direction:column;gap:10px"><div class="top"><b>સ્થિતિ: '+esc(SG[st]||st)+' · પ્રશ્ન '+S.usedN+' / '+S.total+'</b><span class="chip">જવાબ આપ્યા: '+S.answered+' / '+S.nPlayers+'</span></div><div class="top">'+ctl+'</div>';
  var hq=S.hostQ; if(hq&&(st==='question'||st==='locked'||st==='announce'||st==='phasebreak')){ h+='<div class="box" style="background:#fff7d9"><div class="mut">હમણાંનો પ્રશ્ન ('+esc(hq.type==='n'?'સામાન્ય':hq.type==='s'?'સંત પરિચય':'પ્રસંગ ક્રમ')+')</div><div style="font-size:20px;font-weight:700">'+esc(hq.text)+'</div><div>સાચો જવાબ: <b>'+esc(hq.ans)+'</b></div></div>'; }
  h+='<div class="top"><div><label>પ્રશ્નનો સમય (સે)</label><input type="number" id="qsx" value="'+S.qSec+'" style="width:100px" onchange="E(\'host:setQSec\',{sec:this.value})"></div><div class="top"><button class="btn sec" onclick="E(\'host:addBots\',{n:12})">12 ટેસ્ટ બૉટ ઉમેરો</button><button class="btn sec" onclick="E(\'host:clearBots\')">બૉટ કાઢો</button></div></div></div>';
  h+='<h3>Players ('+S.nPlayers+')</h3><div class="g2">'+zonesList()+'</div>';
  return h;
}
function render(){
  if(PJ_CODE){ if(S) pjRender(); return; }
  var a=$('app'); if(!a) return;
  if(!authed){ if(a.getAttribute('data-v')!=='login'||loginErr){ a.setAttribute('data-v','login'); a.innerHTML=loginView(); } return; }
  if(!S||!creds){ if(a.getAttribute('data-v')!=='create'||createErr){ a.setAttribute('data-v','create'); a.innerHTML=createView(); } return; }
  var act=document.activeElement; if(act&&act.id==='qsx') return;
  a.setAttribute('data-v','dash'); a.innerHTML=dashView();
  if($('pj').classList.contains('on')) pjRender();
}

// ---------------- projector ----------------
function mandirHtml(final){
  var z=S.mandir||[]; if(!z.length) return '';
  var cols=z.length>4?Math.ceil(z.length/2):z.length;
  var h='<div class="mz" style="grid-template-columns:repeat('+cols+',minmax(0,1fr))">';
  z.forEach(function(m){
    var rows='<div style="width:100%;height:.9vw;max-height:1.8vh;border-radius:.3vw;background:#6b3f2c"></div>',L=m.level; for(var i=L-1;i>=0;i--){ var w=Math.max(30,100-i*7); rows+='<div style="width:'+w+'%;height:1.3vw;max-height:2.6vh;border-radius:.3vw;background:'+(i%3===2?'#f0b429':'#c9824a')+'"></div>'; }
    var tip=(L>=9)?'<div style="width:0;height:0;border-left:2.2vw solid transparent;border-right:2.2vw solid transparent;border-bottom:3vw solid #f0b429"></div>':'';
    h+='<div class="mt"><div class="st">'+tip+rows+'</div>'+(final?'':'<div class="fog"></div>')+'<div class="nm"><span>'+esc(m.zone)+'</span><small>'+m.n+' Players</small></div></div>';
  });
  return h+'</div>';
}
function pjRender(){
  var el=$('pjin'); if(!el||!S) return; var st=S.status, h='';
  var ph=(st==='announce')?S.nextPhase:S.phase; ph=Math.min(3,ph);
  h+='<div class="pj-top"><div><div class="pj-s">'+esc(S.gSub)+'</div><div class="pj-t">'+esc(S.gTitle)+'</div></div><div style="text-align:right"><div class="pj-s">Room</div><div class="pj-t" style="letter-spacing:.1em">'+esc(S.code)+'</div></div></div>';
  if(S.unoTs&&now()-S.unoTs<8000) h+='<div class="pj-alert">કોઈ UNO પર છે!</div>';
  h+='<div class="pj-body">';
  if(st==='lobby'||st==='ready'){
    var z={}; (S.players||[]).forEach(function(p){z[p.zone]=(z[p.zone]||0)+1;});
    h+='<div style="display:flex;gap:3vw;align-items:center;flex:1"><div>'+qrImg(link(),'22vw')+'<div style="font-size:1.4vw;text-align:center;margin-top:.6vw">QR સ્કેન કરો</div></div><div style="flex:1;display:flex;flex-direction:column;gap:1.2vw"><div style="font-size:2.6vw;font-weight:700">'+(st==='lobby'?'Players જોડાઈ રહ્યા છે':'ગેમ હમણાં શરૂ થશે')+'</div><div style="font-size:5vw;font-weight:700;color:#f0b429">'+S.nPlayers+' Players</div><div style="display:flex;flex-wrap:wrap;gap:.8vw">'+Object.keys(z).sort().map(function(k){return '<div style="background:#3d211b;border-radius:1vw;padding:.6vw 1.4vw;font-size:1.8vw">'+esc(k)+' · <b>'+z[k]+'</b></div>';}).join('')+'</div></div></div>';
  } else if(st==='announce'){
    var pp=S.nextPhase, first=(S.usedN-1)%9===0;
    h+='<div class="pjq" style="background:'+C[pp]+';color:'+TXT[pp]+';align-items:center;text-align:center;flex:1;justify-content:center"><div style="font-size:2.2vw;font-weight:700;letter-spacing:.1em">'+(first?'ફેઝ '+(pp+1)+' શરૂ':'આગલો પ્રશ્ન')+'</div><div class="pj-num">'+S.usedN+'</div><div style="font-size:4vw;font-weight:700">'+esc(S.phaseNames[pp])+' નો પ્રશ્ન</div><div style="font-size:1.8vw">પ્રશ્ન હજી છુપો છે…</div></div>';
  } else if(st==='question'||st==='locked'){
    var q=S.q, left=Math.max(0,Math.ceil((S.timerEnd-now())/1000)), f=q?Math.min(1,Math.max(0,(now()-q.start)/(q.end-q.start))):0;
    h+='<div class="pjq" style="background:'+C[ph]+';color:'+TXT[ph]+';flex:1;justify-content:center"><div style="display:flex;justify-content:space-between;font-size:2vw;font-weight:700"><span>'+esc(S.phaseNames[ph])+' · પ્રશ્ન '+S.usedN+' / '+S.total+'</span><span>'+(st==='question'?'<span id="pjtm">'+left+'</span> સે':'સમય પૂરો')+'</span></div>';
    if(q&&q.img) h+='<img id="pjimg" src="'+esc(q.img)+'" style="max-height:34vh;max-width:100%;align-self:center;border-radius:1vw;'+(q.type==='s'&&st==='question'?'filter:blur(20px)':'')+'" alt="">';
    h+='<div class="q">'+esc(q?q.text:'')+'</div>';
    if(q&&q.type==='k'&&q.items) h+='<div style="font-size:2.2vw;font-weight:600;opacity:.95">'+q.items.map(function(x,i){return (i+1)+'. '+esc(x.t);}).join(' &nbsp;·&nbsp; ')+'</div>';
    h+='<div style="font-size:1.8vw">જવાબ આપ્યા: <b>'+S.answered+' / '+S.nPlayers+'</b></div></div>';
  } else if(st==='phasebreak'||st==='ended'){
    h+='<div style="font-size:2.6vw;font-weight:700;text-align:center">'+(st==='ended'?'બધા પ્રશ્નો પૂરા · રિઝલ્ટ આવી રહ્યું છે':'ફેઝ પૂરો · મંદિર નિર્માણ')+'</div>'+mandirHtml(false);
  } else if(st==='revealed'){
    var w=S.winners||[], last=w[w.length-1];
    if(!last) h+='<div style="font-size:3vw;font-weight:700;text-align:center">વિજેતાઓ જાહેર થવાના છે…</div>'+mandirHtml(false);
    else { h+='<div class="win"><div class="tt">'+esc(last.title)+'</div><div class="nn">'+esc(last.name||'—')+'</div><div class="ee">'+esc((last.zone?last.zone+' · ':'')+last.extra)+'</div></div><div class="wl">'+w.slice(0,-1).reverse().map(function(x){return '<div>'+esc(x.title)+'<b>'+esc(x.name||'—')+'</b></div>';}).join('')+'</div>';
      if(w.length>=8&&S.zones){ var zz=S.zones.map(function(m){return {zone:m.zone,n:m.n,level:Math.min(10,Math.floor(m.mandir/2))};}); S2=S.mandir; S.mandir=zz; h+=mandirHtml(true); S.mandir=S2; } }
  } else h+='<div style="font-size:3vw;text-align:center">'+esc(st)+'</div>';
  if(st==='locked'&&S.mandir) h+=mandirHtml(false);
  h+='</div>';
  el.innerHTML=h;
}
var S2=null;
var SG={lobby:'લૉબી (Players જોડાય છે)',ready:'શરૂ કરવા તૈયાર',announce:'પ્રશ્ન જાહેર થાય છે',question:'પ્રશ્ન ચાલુ',locked:'સમય પૂરો',phasebreak:'ફેઝ પૂરો',ended:'બધા પ્રશ્નો પૂરા',revealed:'રિઝલ્ટ'};
setInterval(function(){ if(!S) return; var t=$('pjtm'); if(t&&S.timerEnd) t.textContent=Math.max(0,Math.ceil((S.timerEnd-now())/1000)); var im=$('pjimg'); if(im&&S.q&&S.q.type==='s'&&S.status==='question'){ var f=Math.min(1,Math.max(0,(now()-S.q.start)/(S.q.end-S.q.start))); im.style.filter='blur('+(20*(1-f)).toFixed(1)+'px)'; } },250);
render();
</script>
</body>
